<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StackClass — Plataforma educativa unificada de TIC2 y Computación y Robótica.">
  <title>StackClass — Plataforma Educativa</title>

  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

  <link rel="stylesheet" href="css/common/design-system.css">
  <link rel="stylesheet" href="css/common/reset.css">
  <link rel="stylesheet" href="css/common/layout.css">
  <link rel="stylesheet" href="css/common/components.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- Canvas partículas -->
  <canvas id="particles-canvas" class="hero-canvas" aria-hidden="true"></canvas>

  <!-- Hero principal -->
  <main class="hero" id="login-hero">

    <!-- Logo + título -->
    <div class="hero-content" id="login-panel">

      <div class="login-logo animate-fade-up">
        <span class="login-logo-icon">⚡</span>
        <h1 class="login-title">Stack<span class="login-title-accent">Class</span></h1>
        <p class="login-tagline">Plataforma educativa modular de TIC y Computación</p>
      </div>

      <!-- Tarjetas de juegos (preview) -->
      <div class="login-games-preview animate-fade-up delay-1" aria-hidden="true">
        <div class="login-game-chip" style="--chip-color:#00d4ff">📋 Kanban Hero</div>
        <div class="login-game-chip" style="--chip-color:#ff6b35">🤖 ArenaBots</div>
        <div class="login-game-chip" style="--chip-color:#2ecc71">⌨️ MecanoClass</div>
        <div class="login-game-chip" style="--chip-color:#e74c3c">🔐 RompeCódigos</div>
        <div class="login-game-chip" style="--chip-color:#f1c40f">🛡️ NetDefender</div>
        <div class="login-game-chip" style="--chip-color:#9b59b6">👾 Hex Invaders</div>
      </div>

      <!-- Panel de login -->
      <div class="login-card animate-fade-up delay-2" id="panel-role-select">
        <h2 class="login-card-title">¿Cómo entras hoy?</h2>
        <p class="login-card-sub">Accede con tu cuenta educativa institucional</p>

        <div class="login-role-buttons">
          <!-- DOCENTE -->
          <button class="login-role-btn login-role-btn--teacher" id="btn-teacher-google">
            <span class="role-btn-icon">👨‍🏫</span>
            <div class="role-btn-text">
              <strong>Soy Docente</strong>
              <small>Accedo con Google + Classroom</small>
            </div>
            <span class="role-btn-arrow">→</span>
          </button>

          <!-- ALUMNO -->
          <button class="login-role-btn login-role-btn--student" id="btn-student-google">
            <span class="role-btn-icon">👨‍🎓</span>
            <div class="role-btn-text">
              <strong>Soy Alumno/a</strong>
              <small>Accedo con mi cuenta Google</small>
            </div>
            <span class="role-btn-arrow">→</span>
          </button>
        </div>

        <div id="login-error" class="form-error" style="margin-top: var(--space-4); text-align: center; font-size: var(--text-sm);"></div>
      </div>
    </div>
  </main>

  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="js/index.js"></script>
</body>
</html>
