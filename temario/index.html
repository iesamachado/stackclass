<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temario Dinámico — StackClass</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">

  <link rel="stylesheet" href="../css/common/design-system.css">
  <link rel="stylesheet" href="../css/common/reset.css">
  <link rel="stylesheet" href="../css/common/layout.css">
  <link rel="stylesheet" href="../css/common/components.css">
  <link rel="stylesheet" href="../css/temario.css">

  <style>
    .topic-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--bg-card, #ffffff);
      border-bottom: 2px solid var(--border, #e2e8f0);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      flex-wrap: wrap;
      gap: 12px;
    }
    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .test-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .test-modal-container {
      background: #ffffff;
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }
    .q-navigator {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    .q-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .q-btn.active {
      border-color: #6366f1;
      background: #eef2ff;
      color: #4f46e5;
    }
    .q-btn.answered {
      background: #10b981;
      color: white;
      border-color: #059669;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-item:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .option-item.selected {
      border-color: #6366f1;
      background: #e0e7ff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Barra de navegación del temario -->
  <header class="topic-navbar" id="topic-header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="../index.html" class="btn btn-outline" style="text-decoration:none; font-weight:600;">← Salir al Dashboard</a>
      <span id="subject-badge" class="topic-badge" style="background:#e0e7ff; color:#3730a3;">Asignatura</span>
    </div>

    <div style="display:flex; align-items:center; gap: 10px;">
      <button id="btn-presentation" class="btn btn-secondary" style="font-weight:600;">📺 Modo Presentación</button>
      <button id="btn-start-test" class="btn btn-primary" style="font-weight:600; background:#10b981;">📝 Hacer Test del Tema</button>
    </div>
  </header>

  <!-- Contenedor principal de teoría -->
  <main class="container" style="max-width: 900px; margin: 30px auto; padding: 0 20px;">
    <div id="topic-loading" style="text-align: center; padding: 60px 0;">
      <h2>Cargando temario...</h2>
      <p style="color:#64748b;">Descargando contenido dinámico de la asignatura</p>
    </div>

    <article id="topic-content" style="display: none;">
      <!-- Se inyecta dinámicamente -->
    </article>
  </main>

  <!-- Pie de página unificado -->
  <footer class="app-footer" role="contentinfo">
    <div class="app-footer-inner">
      <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es" target="_blank" rel="license noopener noreferrer" class="footer-license-link" title="Licencia Creative Commons Atribución-NoComercial-CompartirIgual 4.0 Internacional">
        <img src="../img/cc-by-nc-sa.svg" alt="CC BY-NC-SA 4.0" class="cc-logo-svg" width="80" height="20">
        <span>CC BY-NC-SA 4.0</span>
      </a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a href="../privacidad.html" class="footer-link">Privacidad y Condiciones de uso</a>
    </div>
  </footer>

  <!-- Modal del Test de Evaluación -->
  <div id="test-overlay" class="test-modal-overlay">
    <div class="test-modal-container">
      <div id="test-view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
          <h2 id="test-title" style="margin:0; font-size: 1.5rem;">Test de Repaso</h2>
          <button id="btn-close-test" class="btn btn-ghost" style="font-size:1.2rem;">✕</button>
        </div>

        <div id="test-navigator" class="q-navigator"></div>

        <div id="question-card" style="margin-bottom: 25px;">
          <h3 id="question-text" style="font-size: 1.25rem; margin-bottom: 18px; line-height: 1.5;"></h3>
          <div id="options-container"></div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px;">
          <button id="btn-prev-q" class="btn btn-secondary">⬅ Anterior</button>
          <button id="btn-next-q" class="btn btn-primary">Siguiente ➡</button>
        </div>
      </div>

      <!-- Vista de resultados -->
      <div id="test-results" style="display:none; text-align:center; padding: 20px 0;">
        <div id="results-icon" style="font-size: 5rem; margin-bottom: 10px;">🎉</div>
        <h2 id="results-title" style="font-size: 2rem; margin-bottom: 10px;">¡Test Completado!</h2>
        <div id="results-score" style="font-size: 3.5rem; font-weight: bold; margin-bottom: 15px;"></div>
        <p id="results-msg" style="color: #64748b; font-size: 1.1rem; margin-bottom: 25px;"></p>
        <div id="results-medals" style="margin-bottom: 25px;"></div>
        <button id="btn-finish-test" class="btn btn-primary btn--lg">Aceptar y Volver a la Teoría</button>
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="../js/temario.js"></script>
</body>
</html>
