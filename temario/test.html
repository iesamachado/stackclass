<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Test... — StackClass</title>
  <link rel="stylesheet" href="../css/common/design-system.css">
  <link rel="stylesheet" href="../css/common/reset.css">
  <link rel="stylesheet" href="../css/common/layout.css">
  <script>
    const params = new URLSearchParams(window.location.search);
    const topic = params.get('topic') || params.get('topicId') || params.get('id') || 'block1';
    const subject = params.get('subject') || params.get('subjectId') || '';
    let target = 'index.html?topicId=' + encodeURIComponent(topic) + '&startTest=true';
    if (subject) target += '&subjectId=' + encodeURIComponent(subject);
    window.location.replace(target);
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;">
    <h2>📝 Cargando test de evaluación...</h2>
    <p style="color: #64748b;">Redirigiendo al temario interactivo de StackClass.</p>
  </div>
  <!-- Pie de página unificado -->

        <img src="../img/cc-by-nc-sa.svg" alt="CC BY-NC-SA 4.0" class="cc-logo-svg" width="80" height="20">
        <span>CC BY-NC-SA 4.0</span>
      </a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a href="../privacidad.html" class="footer-link">Privacidad y Condiciones de uso</a>
    </div>
  </footer>
</body>
</html>
